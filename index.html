<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Análise de Contrato com IA</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

<style>

body{
font-family:'Segoe UI',sans-serif;
background: radial-gradient(circle at top,#1e293b,#020617);
color:white;
margin:0;
}

.container{
max-width:900px;
margin:auto;
padding:40px;
text-align:center;
}

h1{
font-size:40px;
background: linear-gradient(90deg,#60a5fa,#22c55e);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.box{
background: rgba(255,255,255,0.05);
backdrop-filter: blur(15px);
padding:40px;
border-radius:16px;
box-shadow:0 0 40px rgba(34,197,94,0.2);
}

textarea{
width:100%;
height:180px;
border-radius:10px;
padding:15px;
background:#020617;
color:white;
border:1px solid rgba(255,255,255,0.1);
}

button{
background: linear-gradient(90deg,#2563eb,#22c55e);
padding:16px 28px;
border-radius:10px;
color:white;
border:none;
margin-top:20px;
cursor:pointer;
font-size:18px;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 20px rgba(34,197,94,0.5);
}

#progress{
margin-top:20px;
background:#020617;
border-radius:10px;
overflow:hidden;
display:none;
}

#bar{
height:12px;
width:0%;
background: linear-gradient(90deg,#22c55e,#60a5fa,#22c55e);
background-size:200% 100%;
animation:move 2s linear infinite;
}

@keyframes move{
0%{background-position:0%}
100%{background-position:200%}
}

#status{
margin-top:15px;
color:#9ca3af;
}

#resultado{
display:none;
margin-top:30px;
background: rgba(255,255,255,0.05);
backdrop-filter: blur(10px);
padding:25px;
border-radius:14px;
animation:fade 0.5s;
}

@keyframes fade{
from{opacity:0;transform:translateY(10px)}
to{opacity:1}
}

.premium{
margin-top:20px;
padding:20px;
border-radius:12px;
background: linear-gradient(135deg,#020617,#0f172a);
border:1px solid rgba(34,197,94,0.2);
}

.cta{
display:block;
text-decoration:none;
}

.cta button{
width:100%;
margin-top:15px;
font-size:18px;
}

.urgencia{
color:#facc15;
margin-top:10px;
}

.alerta{
color:#f87171;
font-weight:bold;
}

.footer{
margin-top:60px;
padding:30px;
background:linear-gradient(135deg,#020617,#0f172a);
border-top:1px solid rgba(255,255,255,0.1);
text-align:center;
}

.footer-box{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
margin-bottom:20px;
}

.badge{
background:rgba(255,255,255,0.05);
padding:15px 20px;
border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>IA de Análise Contratual</h1>

<p id="contador"></p>

<div class="box">

<textarea id="contrato" placeholder="Cole ou envie seu contrato..."></textarea>

<input type="file" id="arquivo">

<button onclick="analisar()">Analisar contrato</button>

<div id="progress"><div id="bar"></div></div>

<p id="status"></p>

<div id="resultado"></div>

</div>
</div>

<!-- RODAPÉ -->
<div class="footer">

<div class="footer-box">

<div class="badge">🔒 Análise 100% Segura</div>
<div class="badge">🛡️ Dados não armazenados</div>
<div class="badge">🤖 IA avançada</div>
<div class="badge">⚖️ Foco jurídico</div>

</div>

<p style="color:#6b7280;font-size:14px;">
© 2026 J.Simões Engenharia de Software — Todos os direitos reservados
</p>

</div>

<script>

// contador dinâmico
let n=3124
setInterval(()=>{
n+=Math.floor(Math.random()*4)
document.getElementById("contador").innerText=n+" contratos analisados hoje"
},2000)

const etapas=[
"📄 Lendo contrato...",
"🧠 Interpretando cláusulas...",
"⚖️ Avaliando riscos jurídicos...",
"🔍 Detectando problemas ocultos...",
"✅ Finalizando análise..."
]

async function analisar(){

const btn=document.querySelector("button")
const bar=document.getElementById("bar")
const progress=document.getElementById("progress")
const status=document.getElementById("status")
const resultado=document.getElementById("resultado")

let texto=document.getElementById("contrato").value.trim()
let arquivo=document.getElementById("arquivo").files[0]

if(!texto && !arquivo){
alert("Envie um contrato")
return
}

btn.disabled=true
btn.innerText="Processando..."

progress.style.display="block"

let step=0
let interval=setInterval(()=>{
status.innerText=etapas[step]
bar.style.width=(step*20)+"%"
step++
if(step>=etapas.length) clearInterval(interval)
},800)

// leitura arquivo
if(arquivo){
const nome=arquivo.name.toLowerCase()

if(nome.endsWith(".pdf")){
const buffer=await arquivo.arrayBuffer()
const pdf=await pdfjsLib.getDocument({data:buffer}).promise

let conteudo=""
for(let i=1;i<=pdf.numPages;i++){
const page=await pdf.getPage(i)
const txt=await page.getTextContent()
conteudo+=txt.items.map(i=>i.str).join(" ")+" "
}
texto=conteudo
}

if(nome.endsWith(".docx")){
const buffer=await arquivo.arrayBuffer()
const result=await mammoth.extractRawText({arrayBuffer:buffer})
texto=result.value
}
}

// limpeza
texto=texto.replace(/\s+/g," ").trim()

// correção contrato grande
if(texto.length>12000){
texto=texto.substring(0,12000)
status.innerText="⚠️ Contrato grande, otimizando análise..."
}

// envio API
const res=await fetch("https://mctnbgrgnraixgwwvion.supabase.co/functions/v1/analisar-contrato",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({contrato:texto})
})

const dados=await res.json()

clearInterval(interval)
bar.style.width="100%"
status.innerText="🎯 Análise concluída"

// resultado
resultado.style.display="block"

resultado.innerHTML=`

<h3>Resultado da análise</h3>

<p><b>Risco:</b> ${dados.risco}</p>

<p>${dados.preview}</p>

<div class="premium">

<p class="alerta">
🚨 Este contrato pode gerar prejuízo financeiro se assinado sem revisão.
</p>

<p><b>🔒 Identificamos cláusulas críticas ocultas</b></p>

<ul>
<li>✔ Cláusulas abusivas</li>
<li>✔ Riscos jurídicos reais</li>
<li>✔ Possível prejuízo financeiro</li>
</ul>

<a href="https://pay.kiwify.com.br/xEno6gD" target="_blank" class="cta">
<button>
Ver riscos ocultos antes de assinar por R$29,90
</button>
</a>

<p class="urgencia">
⏳ Oferta válida apenas hoje
</p>

</div>
`

btn.disabled=false
btn.innerText="Analisar contrato"

}

</script>

</body>
</html>
