<script>

async function analisar(){

try{

let texto = document.getElementById("contrato").value
let arquivo = document.getElementById("arquivo").files[0]

if(texto.length < 30 && !arquivo){

alert("Cole o contrato ou envie um arquivo")
return

}

document.getElementById("progress").style.display="block"
document.getElementById("bar").style.width="20%"

let resposta

if(arquivo){

const formData = new FormData()

formData.append("arquivo",arquivo)
formData.append("contrato",texto)

resposta = await fetch(
"https://mctnbgrgnraixgwwvion.supabase.co/functions/v1/analisar-contrato",
{
method:"POST",
body:formData
})

}else{

resposta = await fetch(
"https://mctnbgrgnraixgwwvion.supabase.co/functions/v1/analisar-contrato",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contrato:texto
})
})

}

document.getElementById("bar").style.width="70%"

if(!resposta.ok){

throw new Error("Erro na API")

}

const dados = await resposta.json()

console.log("Resposta da API:",dados)

document.getElementById("bar").style.width="100%"

document.getElementById("resultado").style.display="block"

let risco = dados.risco || "MÉDIO"
let preview = dados.preview || "A análise identificou possíveis cláusulas que podem gerar riscos financeiros ou jurídicos."

document.getElementById("resultado").innerHTML = `

<p class="alerta">⚠️ Análise preliminar concluída</p>

<p><b>Classificação de risco:</b> ${risco}</p>

<p>${preview}</p>

<p><b>O relatório completo revela:</b></p>

<ul>
<li>Cláusulas perigosas destacadas</li>
<li>Explicação jurídica detalhada</li>
<li>Estimativa de prejuízo financeiro</li>
<li>Orientação antes de assinar</li>
</ul>

<a href="https://pay.kiwify.com.br/xEno6gD" target="_blank">

<button class="comprar">
Desbloquear relatório completo por R$29,90
</button>

</a>

`

}catch(erro){

console.error("Erro:",erro)

document.getElementById("progress").style.display="none"

document.getElementById("resultado").style.display="block"

document.getElementById("resultado").innerHTML = `

<p class="alerta">Erro ao analisar contrato</p>

<p>Tente novamente em alguns segundos.</p>

`

}

}

</script>
