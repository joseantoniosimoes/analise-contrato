<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Análise de Contrato com IA</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

<style>
body{
font-family:Arial;
background:#0b1120;
color:white;
margin:0;
}
.container{
max-width:900px;
margin:auto;
padding:40px;
text-align:center;
}
.box{
background:#111827;
padding:40px;
border-radius:12px;
}
textarea{
width:100%;
height:180px;
border-radius:8px;
padding:15px;
background:#1f2937;
color:white;
border:none;
}
button{
background:#2563eb;
padding:16px 28px;
border-radius:8px;
color:white;
border:none;
margin-top:20px;
cursor:pointer;
}
#progressText{
margin-top:15px;
color:#9ca3af;
font-size:14px;
}
#bar{
height:10px;
width:0%;
background:#22c55e;
border-radius:10px;
transition:0.4s;
}
#progress{
background:#1f2937;
margin-top:15px;
border-radius:10px;
overflow:hidden;
display:none;
}
#resultado{
display:none;
margin-top:30px;
background:#1f2937;
padding:20px;
border-radius:10px;
text-align:left;
}
.fade{
animation:fade 0.4s;
}
@keyframes fade{
from{opacity:0}
to{opacity:1}
}
</style>
</head>

<body>

<div class="container">

<h1>Análise de Contrato com IA</h1>
<p id="contador"></p>

<div class="box">

<textarea id="contrato" placeholder="Cole seu contrato aqui..."></textarea>

<input type="file" id="arquivo">

<button onclick="analisar()">Analisar</button>

<div id="progress">
<div id="bar"></div>
</div>

<p id="progressText"></p>

<div id="resultado"></div>

</div>
</div>

<script>

// contador vivo
let n=2317
setInterval(()=>{
n+=Math.floor(Math.random()*3)
document.getElementById("contador").innerText = n+" contratos analisados hoje"
},2000)

// mensagens inteligentes
const mensagens=[
"Lendo contrato...",
"Identificando cláusulas...",
"Analisando riscos jurídicos...",
"Aplicando inteligência artificial...",
"Finalizando análise..."
]

async function analisar(){

const botao=document.querySelector("button")
const bar=document.getElementById("bar")
const progress=document.getElementById("progress")
const textProgress=document.getElementById("progressText")
const resultado=document.getElementById("resultado")

try{

let texto=document.getElementById("contrato").value.trim()
let arquivo=document.getElementById("arquivo").files[0]

if(!texto && !arquivo){
alert("Envie ou cole um contrato")
return
}

botao.disabled=true
botao.innerText="Analisando..."

progress.style.display="block"

// animação UX
let etapa=0
let interval=setInterval(()=>{
bar.style.width=(etapa*20)+"%"
textProgress.innerText=mensagens[etapa]
etapa++
if(etapa>=mensagens.length) clearInterval(interval)
},700)

// leitura arquivo
if(arquivo){

const nome=arquivo.name.toLowerCase()

if(nome.endsWith(".pdf")){
const buffer=await arquivo.arrayBuffer()
const pdf=await pdfjsLib.getDocument({data:buffer}).promise

let conteudo=""
for(let i=1;i<=pdf.numPages;i++){
const page=await pdf.getPage(i)
const txt=await page.getTextContent()
conteudo+=txt.items.map(i=>i.str).join(" ")+" "
}
texto=conteudo
}

if(nome.endsWith(".docx")){
const buffer=await arquivo.arrayBuffer()
const result=await mammoth.extractRawText({arrayBuffer:buffer})
texto=result.value
}

}

// limpeza
texto = texto.replace(/\s+/g," ").trim()

// 🚨 CORREÇÃO DO TAMANHO
if(texto.length > 12000){
texto = texto.substring(0,12000)
textProgress.innerText="Contrato muito grande, resumindo automaticamente..."
}

// envio
const resposta=await fetch(
"https://mctnbgrgnraixgwwvion.supabase.co/functions/v1/analisar-contrato",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({ contrato:texto })
})

const dados=await resposta.json()

clearInterval(interval)
bar.style.width="100%"
textProgress.innerText="Análise concluída"

// resultado
resultado.classList.add("fade")
resultado.style.display="block"

resultado.innerHTML=`

<h3>Resultado</h3>

<p><b>Risco:</b> ${dados.risco}</p>

<p>${dados.preview}</p>

<div style="margin-top:20px;background:#0f172a;padding:15px;border-radius:8px;">
<p><b>🔒 Conteúdo Premium</b></p>
<p>Detectamos riscos ocultos importantes.</p>

<button style="background:#22c55e;width:100%;padding:15px;border:none;border-radius:8px;">
Desbloquear análise completa
</button>
</div>
`

}catch(e){
resultado.style.display="block"
resultado.innerHTML="Erro ao analisar"
}

botao.disabled=false
botao.innerText="Analisar"

}

</script>

</body>
</html>
