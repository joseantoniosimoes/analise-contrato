<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Análise de Contrato com IA</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

<style>
body{
font-family:Arial, Helvetica, sans-serif;
background:#0b1120;
color:white;
margin:0;
padding:0;
}
.container{
max-width:900px;
margin:auto;
padding:40px;
text-align:center;
}
h1{font-size:38px;margin-bottom:10px;}
.sub{color:#9ca3af;font-size:18px;margin-bottom:20px;}
.prova{color:#22c55e;font-weight:bold;margin-bottom:40px;}
.box{
background:#111827;
padding:40px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}
textarea{
width:100%;
height:180px;
border-radius:8px;
border:none;
padding:15px;
margin-top:15px;
background:#1f2937;
color:white;
}
.file-upload{margin-top:20px;}
.file-upload input{display:none;}
.file-label{
display:inline-block;
padding:14px 24px;
background:#374151;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}
.file-label:hover{background:#4b5563;}
button{
background:#2563eb;
border:none;
padding:16px 28px;
border-radius:8px;
font-size:18px;
color:white;
margin-top:25px;
cursor:pointer;
transition:0.2s;
}
button:hover{background:#1d4ed8;}
button:disabled{opacity:0.6;}
#progress{
width:100%;
background:#1f2937;
border-radius:10px;
margin-top:20px;
display:none;
overflow:hidden;
}
#bar{
height:12px;
width:0%;
background:linear-gradient(90deg,#22c55e,#4ade80);
border-radius:10px;
transition:width 0.5s;
}
#resultado{
display:none;
margin-top:40px;
background:#1f2937;
padding:30px;
border-radius:10px;
text-align:left;
animation:fadeIn 0.5s ease;
}
@keyframes fadeIn{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}
.alerta{
color:#facc15;
font-weight:bold;
font-size:22px;
margin-bottom:15px;
}
.comprar{
background:#22c55e;
margin-top:25px;
width:100%;
font-size:20px;
}
.footer{
margin-top:60px;
color:#6b7280;
font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>Análise Profissional de Contrato com IA</h1>

<p class="sub">
Descubra riscos jurídicos antes de assinar qualquer contrato.
</p>

<p class="prova">
<span id="contador"></span> contratos analisados hoje
</p>

<div class="box">

<h2>Envie seu contrato</h2>

<textarea id="contrato" placeholder="Cole o contrato..."></textarea>

<div class="file-upload">
<label class="file-label">
📄 Escolher arquivo
<input type="file" id="arquivo" accept=".pdf,.doc,.docx">
</label>
</div>

<button onclick="analisar()">Analisar contrato</button>

<div id="progress"><div id="bar"></div></div>

<div id="resultado"></div>

</div>

<p class="footer">
© 2026 J.Simões Engenharia de Software
</p>

</div>

<script>

// 🔥 contador dinâmico (prova social)
let n = 2317
setInterval(()=>{
n += Math.floor(Math.random()*3)
document.getElementById("contador").innerText = n
}, 2000)

async function analisar(){

const botao = document.querySelector("button")
const bar = document.getElementById("bar")
const progress = document.getElementById("progress")
const resultado = document.getElementById("resultado")

try{

let texto=document.getElementById("contrato").value.trim()
let arquivo=document.getElementById("arquivo").files[0]

if(!texto && !arquivo){
alert("Cole o contrato ou envie um arquivo")
return
}

botao.disabled=true
botao.innerText="🔎 Analisando seu contrato..."

progress.style.display="block"

// progresso fake inteligente
bar.style.width="25%"
await new Promise(r=>setTimeout(r,400))

bar.style.width="55%"
await new Promise(r=>setTimeout(r,400))

// leitura arquivo
if(arquivo){

const nome=arquivo.name.toLowerCase()

if(nome.endsWith(".pdf")){
const buffer=await arquivo.arrayBuffer()
const pdf=await pdfjsLib.getDocument({data:buffer}).promise

let conteudo=""
for(let i=1;i<=pdf.numPages;i++){
const page=await pdf.getPage(i)
const txt=await page.getTextContent()
conteudo+=txt.items.map(i=>i.str).join(" ")+" "
}

texto=conteudo
}

if(nome.endsWith(".docx")){
const buffer=await arquivo.arrayBuffer()
const result=await mammoth.extractRawText({arrayBuffer:buffer})
texto=result.value
}

if(nome.endsWith(".doc")){
alert("Use .docx")
return
}

}

// limpeza inteligente
texto = texto
.replace(/\s+/g," ")
.replace(/(\r\n|\n|\r)/gm," ")
.trim()

if(texto.length > 5000){
alert("Contrato muito grande, otimizando análise...")
}

if(!texto || texto.length<20){
alert("Não foi possível ler o contrato.")
return
}

bar.style.width="75%"

// tempo simulado
const tempo = (Math.random()*2+2).toFixed(1)

// envio
const resposta=await fetch(
"https://mctnbgrgnraixgwwvion.supabase.co/functions/v1/analisar-contrato",
{
method:"POST",
headers:{
 "Content-Type":"application/json",
 "x-key":"123456"
},
body:JSON.stringify({ contrato:texto })
})

const dados=await resposta.json()

bar.style.width="100%"

let risco=dados.risco || "MÉDIO"
let preview=dados.preview || "Foram encontrados pontos de atenção."

// mensagens melhoradas
let mensagemExtra=""

if(risco==="BAIXO"){
mensagemExtra="Identificamos pontos sutis que podem virar problemas no futuro."
}
if(risco==="MÉDIO"){
mensagemExtra="⚠️ Atenção: este contrato pode gerar prejuízos se assinado sem revisão."
}
if(risco==="ALTO"){
mensagemExtra="🚨 ALERTA: Este contrato apresenta alto risco financeiro ou jurídico."
}

let previewFormatado = preview
.split(".")
.filter(p=>p.trim().length>0)
.slice(0,3)
.map(p=>`<li>${p.trim()}.</li>`)
.join("")

resultado.style.display="block"

resultado.innerHTML=`

<p class="alerta">⚠️ Análise preliminar concluída</p>

<p style="color:#9ca3af;">Análise concluída em ${tempo}s</p>

<p><b>Classificação de risco:</b> 
<span style="color:${risco==="ALTO"?"#ef4444":risco==="MÉDIO"?"#facc15":"#22c55e"};font-weight:bold">
${risco}
</span></p>

<ul>${previewFormatado}</ul>

<p style="color:#f87171;font-weight:bold;">
${mensagemExtra}
</p>

<div style="background:#0f172a;padding:20px;border-radius:10px;margin-top:20px;">

<p style="font-weight:bold;font-size:18px;">
🔒 Identificamos cláusulas críticas que exigem atenção imediata
</p>

<p style="color:#9ca3af;">
O restante da análise contém riscos financeiros e jurídicos detalhados.
</p>

<ul>
<li>✔ Cláusulas abusivas detalhadas</li>
<li>✔ Riscos jurídicos explicados</li>
<li>✔ Possível prejuízo financeiro</li>
<li>✔ Orientação antes de assinar</li>
</ul>

<a href="https://pay.kiwify.com.br/xEno6gD" target="_blank">
<button class="comprar">
Ver análise completa por R$29,90
</button>
</a>

<p style="color:#facc15;">⏳ Oferta por tempo limitado</p>
<p style="font-size:13px;color:#6b7280;">
Apenas hoje: acesso completo liberado
</p>

</div>

`

resultado.scrollIntoView({behavior:"smooth"})

}catch(e){

resultado.style.display="block"
resultado.innerHTML=`<p class="alerta">Erro ao analisar contrato</p>`

}finally{

botao.disabled=false
botao.innerText="Analisar contrato"

}

}

</script>

</body>
</html>
