<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Análise de Contrato com IA</title>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<!-- WORD -->
<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

<style>

body{
font-family: 'Segoe UI', Arial;
background: linear-gradient(135deg, #0b1120, #0f172a);
color:white;
margin:0;
}

.container{
max-width:1000px;
margin:auto;
padding:50px 20px;
text-align:center;
}

h1{
font-size:42px;
font-weight:700;
}

.sub{
color:#94a3b8;
font-size:20px;
}

.box{
background:#020617;
padding:40px;
border-radius:16px;
margin-top:30px;
}

textarea{
width:100%;
height:180px;
border-radius:10px;
padding:15px;
margin-top:15px;
background:#000;
color:white;
}

.file-label{
display:inline-block;
padding:14px;
background:#1f2937;
border-radius:10px;
cursor:pointer;
margin-top:20px;
}

button{
padding:18px 30px;
margin-top:20px;
cursor:pointer;
}

#resultado{
display:none;
margin-top:20px;
background:#000;
padding:20px;
border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>Análise de Contrato com IA</h1>

<div class="box">

<textarea id="contrato" placeholder="Cole o contrato ou envie um arquivo..."></textarea>

<label class="file-label">
📄 Upload PDF ou Word
<input type="file" id="arquivo" accept=".pdf,.docx" hidden>
</label>

<br>

<button onclick="analisar()">Analisar contrato</button>

<div id="resultado"></div>

</div>

</div>

<script>

// 📄 LER ARQUIVO
document.getElementById("arquivo").addEventListener("change", async function(e) {

  const file = e.target.files[0];
  if (!file) return;

  const textarea = document.getElementById("contrato");

  // PDF
  if (file.type === "application/pdf") {

    const reader = new FileReader();

    reader.onload = async function() {
      const typedarray = new Uint8Array(this.result);
      const pdf = await pdfjsLib.getDocument(typedarray).promise;

      let texto = "";

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        texto += content.items.map(item => item.str).join(" ");
      }

      textarea.value = texto;
    };

    reader.readAsArrayBuffer(file);
  }

  // WORD
  else if (file.name.endsWith(".docx")) {

    const reader = new FileReader();

    reader.onload = function(event) {
      mammoth.extractRawText({ arrayBuffer: event.target.result })
        .then(result => {
          textarea.value = result.value;
        });
    };

    reader.readAsArrayBuffer(file);
  }

});


// 🔥 FUNÇÃO PRINCIPAL
window.analisar = async function () {

  const texto = document.getElementById("contrato").value;
  const resultado = document.getElementById("resultado");

  if (!texto.trim()) {
    alert("Cole ou envie um contrato primeiro!");
    return;
  }

  resultado.style.display = "block";
  resultado.innerHTML = `
    <b>✅ Contrato carregado com sucesso!</b><br><br>
    Agora podemos enviar para análise com IA.
  `;

};

</script>

</body>
</html>
