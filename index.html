<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Análise de Contrato com IA</title>

<!-- 🔥 PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<!-- 🔥 WORD -->
<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

<!-- 🔥 OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body{
font-family:Arial;
background:#0b1120;
color:white;
margin:0;
}

.container{
max-width:900px;
margin:auto;
padding:40px;
text-align:center;
}

.box{
background:#111827;
padding:40px;
border-radius:12px;
}

textarea{
width:100%;
height:180px;
padding:15px;
background:#1f2937;
color:white;
border:none;
border-radius:8px;
}

.file-label{
display:inline-block;
padding:14px;
background:#374151;
border-radius:8px;
cursor:pointer;
margin-top:15px;
}

button{
background:#2563eb;
padding:16px;
border:none;
color:white;
border-radius:8px;
margin-top:20px;
cursor:pointer;
}

#progress{
margin-top:20px;
display:none;
}

#resultado{
margin-top:30px;
display:none;
background:#1f2937;
padding:20px;
border-radius:10px;
}

.loader{
margin-top:10px;
color:#22c55e;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Análise de Contrato com IA</h1>

<div class="box">

<textarea id="contrato" placeholder="Cole o contrato..."></textarea>

<br>

<label class="file-label">
📄 Enviar PDF ou Word
<input type="file" id="arquivo" hidden>
</label>

<br>

<button onclick="analisar()">Analisar contrato</button>

<div id="progress">
<p id="status">Iniciando análise...</p>
<p class="loader">⏳ Carregando análise avançada...</p>
</div>

<div id="resultado"></div>

</div>

</div>

<script>

async function analisar(){

try{

let texto=document.getElementById("contrato").value.trim()
let arquivo=document.getElementById("arquivo").files[0]

if(!texto && !arquivo){
alert("Envie ou cole um contrato")
return
}

document.getElementById("progress").style.display="block"
document.getElementById("status").innerText="Processando documento..."

let tipo="texto"

// 🔥 DETECTAR E LER ARQUIVO
if(arquivo){

const nome=arquivo.name.toLowerCase()

// PDF
if(nome.endsWith(".pdf")){
tipo="pdf"

const buffer=await arquivo.arrayBuffer()
let conteudo=""

// tenta leitura normal
try{

const pdf=await pdfjsLib.getDocument({data:buffer}).promise

for(let i=1;i<=pdf.numPages;i++){
const page=await pdf.getPage(i)
const txt=await page.getTextContent()
const items=txt.items.map(i=>i.str)
conteudo+=items.join(" ")+" "
}

}catch(e){}

// 🔥 OCR automático
if(!conteudo || conteudo.length<20){

tipo="pdf_escaneado"
document.getElementById("status").innerText="Aplicando leitura avançada (OCR)..."

const pdf=await pdfjsLib.getDocument({data:buffer}).promise

for(let i=1;i<=pdf.numPages;i++){

const page=await pdf.getPage(i)
const viewport=page.getViewport({scale:2})

const canvas=document.createElement("canvas")
const context=canvas.getContext("2d")

canvas.height=viewport.height
canvas.width=viewport.width

await page.render({canvasContext:context,viewport}).promise

const img=canvas.toDataURL("image/png")

const result=await Tesseract.recognize(img,'por')

conteudo+=result.data.text+" "
}

}

texto=conteudo
}

// WORD
if(nome.endsWith(".docx")){
tipo="word"

const buffer=await arquivo.arrayBuffer()
const result=await mammoth.extractRawText({arrayBuffer:buffer})
texto=result.value
}

// DOC antigo
if(nome.endsWith(".doc")){
alert("Use .docx")
return
}

}

if(!texto || texto.length<20){
alert("Não foi possível ler o contrato")
return
}

document.getElementById("status").innerText="Analisando com IA..."

// 🔵 ENVIO PARA SUPABASE
const resposta=await fetch(
"https://mctnbgrgnraixgwwvion.supabase.co/functions/v1/analisar-contrato",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({contrato:texto})
})

const dados=await resposta.json()

// 🔥 SALVAR NO SUPABASE
await fetch(
"https://mctnbgrgnraixgwwvion.supabase.co/rest/v1/analises",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":"SUA_PUBLIC_ANON_KEY_AQUI",
"Authorization":"Bearer SUA_PUBLIC_ANON_KEY_AQUI"
},
body:JSON.stringify({
texto:texto.substring(0,1000),
risco:dados.risco,
tipo:tipo,
data:new Date().toISOString()
})
})

let risco=dados.risco || "MÉDIO"
let preview=dados.preview || "Análise concluída"

document.getElementById("resultado").style.display="block"

document.getElementById("resultado").innerHTML=`

<p><b>Tipo detectado:</b> ${tipo}</p>

<p><b>Risco:</b> ${risco}</p>

<p>${preview}</p>

`

}catch(e){

document.getElementById("resultado").innerHTML="Erro ao analisar"

}

}

</script>

</body>
</html>
